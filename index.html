<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IZZY360 Rental - Semakan Tarikh Tempahan</title>
  
  <!-- FullCalendar CSS -->
  <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet" />
  
  <style>
    :root {
      --primary-color: #007bff;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      color: #1a1a1a;
      margin-bottom: 5px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    #calendar {
      max-width: 100%;
      margin: 0 auto;
    }

    /* Custom Styling FullCalendar */
    .fc-event {
      cursor: pointer;
      border-radius: 4px;
      padding: 2px 5px;
      font-size: 0.85em;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      font-size: 0.9em;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .color-box {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .color-available { background-color: #28a745; }
    .color-booked { background-color: #dc3545; }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }
      .container {
        padding: 15px;
      }
      .fc-toolbar {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>IZZY360 Rental</h1>
    <p class="subtitle">Semak Tarikh Kekosongan & Tempahan Kameral / Equipment</p>

    <div id="calendar"></div>

    <div class="legend">
      <div class="legend-item">
        <div class="color-box color-booked"></div>
        <span>Telah Ditempah (Booked / Busy)</span>
      </div>
    </div>
  </div>

  <!-- FullCalendar JS -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
  <!-- FullCalendar Google Calendar Plugin -->
  <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/google-calendar@5.11.3/main.global.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const calendarEl = document.getElementById('calendar');

      // --- CALENDAR ID GOOGLE ANDA ---
      const MY_CALENDAR_ID = '8451c5e4ac1b1a604e21ef369c1314070e987f1b9e55771b41531f3dacfc9a35@group.calendar.google.com';

      const calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,timeGridWeek'
        },
        height: 'auto',
        
        // Pilihan Google Calendar Event
        events: {
          googleCalendarId: MY_CALENDAR_ID
        },

        eventColor: '#dc3545', // Warna merah untuk event yang booked/busy
        
        eventDataTransform: function(eventData) {
          // Sorokkan butiran peribadi jika perlu, cuma tunjuk status BOOKED
          return {
            title: eventData.title || 'BOOKED',
            start: eventData.start,
            end: eventData.end,
            allDay: eventData.allDay
          };
        },

        eventClick: function(info) {
          info.jsEvent.preventDefault(); // Elak dari buka link Google Calendar
          alert('Tarikh ini telah ditempah: ' + info.event.title);
        }
      });

      calendar.render();
    });
  </script>

</body>
</html>
